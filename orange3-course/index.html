<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orange3 지도학습 강의실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: 위젯 캔버스 느낌의 모눈 배경 위에, 왼쪽 커리큘럼 + 오른쪽 강의 패널 */
:root{
  --bg:#f6f4f1; --grid:#e7e2db; --panel:#ffffff; --ink:#1f1c19; --muted:#6c645c;
  --line:#ddd6cd; --accent:#e8700f; --accent-ink:#ffffff; --accent-soft:#fdecdc;
  --link:#3b6fb6; --good:#2f8a55; --good-soft:#e2f3e8; --bad:#c2412d; --bad-soft:#fbe5e1;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171513; --grid:#221f1c; --panel:#211e1b; --ink:#f1ece6; --muted:#a89f95;
  --line:#3a3530; --accent:#f58a2e; --accent-ink:#1b1209; --accent-soft:#3a2614;
  --link:#86aee6; --good:#5cc489; --good-soft:#1b3326; --bad:#f07a66; --bad-soft:#3b1f1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171513; --grid:#221f1c; --panel:#211e1b; --ink:#f1ece6; --muted:#a89f95;
  --line:#3a3530; --accent:#f58a2e; --accent-ink:#1b1209; --accent-soft:#3a2614;
  --link:#86aee6; --good:#5cc489; --good-soft:#1b3326; --bad:#f07a66; --bad-soft:#3b1f1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1.05;margin:4px 0 6px;text-wrap:balance}
h1 .dot{color:var(--accent)}
.sub{color:var(--muted);margin:0;max-width:60ch}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:92px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s ease}

/* Main grid */
main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}

/* Curriculum */
nav.curr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){nav.curr{position:static;order:2}}
.ch{padding:8px 8px 4px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.ch:not(:first-child){border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}
.item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;
  text-align:left;background:none;border:0;color:inherit;font:inherit;padding:8px;border-radius:9px;cursor:pointer}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.node{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--panel)}
.item.done .node{border-color:var(--good);background:var(--good);color:var(--panel)}
.item[aria-current="true"] .node{border-color:var(--accent);color:var(--accent)}
.item.done[aria-current="true"] .node{color:var(--panel)}
.item .t{font-size:14px;line-height:1.35;min-width:0}
.item .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Lesson */
article{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.player{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;display:block}
.player img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;transition:opacity .2s}
.player iframe{width:100%;height:100%;border:0;display:block}
a.player:hover img{opacity:1}
.play{position:absolute;inset:0;display:grid;place-items:center;text-decoration:none}
.play span{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;
  padding:12px 20px;border-radius:99px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:15px}
.play svg{width:18px;height:18px;fill:currentColor}
.body{padding:22px clamp(16px,3vw,30px) 26px;display:flex;flex-direction:column;gap:20px}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tag{background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:99px}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4vw,34px);line-height:1.15;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:700}
.lead{margin:0;font-size:16px;max-width:65ch}
ul.points{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:65ch}
ul.points b{color:var(--accent)}
.widgets{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.w{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:22px;padding:4px 12px 4px 6px;font-size:13.5px;background:var(--bg)}
.w::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--accent);opacity:.85}
.arrow{color:var(--muted);font-family:var(--f-mono)}

/* Quiz */
.quiz{border:1.5px dashed var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.quiz p{margin:0;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{font-size:14px;margin:0;min-height:1.4em}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}

/* Footer controls */
.ctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:18px}
.btn{font:inherit;font-weight:500;border-radius:10px;padding:9px 16px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.nav2{display:flex;gap:8px}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="eyebrow">YouTube 재생목록 · 생활코딩</div>
    <h1>Orange3 지도학습<span class="dot">.</span></h1>
    <p class="sub">코딩 없이 위젯을 선으로 이어 머신러닝 모델을 만들고, 경쟁시키고, 공정하게 평가하는 법을 배웁니다.</p>
  </div>
  <div class="stats">
    <div class="stat"><b id="sCount">10</b><span>강의</span></div>
    <div class="stat"><b id="sTime">-</b><span>총 재생시간</span></div>
    <div class="stat" style="min-width:140px"><b id="sProg">0%</b><span>내 진도 · 퀴즈 <span id="sQuiz">0</span>/10</span><div class="bar"><i id="pBar"></i></div></div>
  </div>
</header>

<main>
  <nav class="curr" id="curr" aria-label="커리큘럼"></nav>
  <article id="lesson" aria-live="polite"></article>
</main>

<p class="foot">강의 영상: 생활코딩 「Orange3 지도학습」 재생목록 (<a href="https://www.youtube.com/playlist?list=PLuHgQVnccGMCIA_MXFcS-IWrqKnx62Iwp" target="_blank" rel="noopener">YouTube에서 열기</a>) · 학습 노트와 퀴즈는 강의 흐름을 바탕으로 정리한 요약입니다. 진도는 이 브라우저에만 저장됩니다.</p>
</div>

  points:["<b>CA</b>(정확도): 전체 중 맞힌 비율.","<b>AUC·F1·Precision·Recall</b>로 다른 각도에서 평가합니다.","<b>Confusion Matrix</b>로 어떤 범주를 어떤 범주로 헷갈렸는지 확인합니다."],
  widgets:["Test and Score","Confusion Matrix"],
  q:{t:"'어떤 범주를 무엇으로 착각했는지' 보여주는 위젯은?",o:["Data Table","Confusion Matrix","File"],a:1,e:"혼동행렬(Confusion Matrix)이 오답 패턴을 보여줍니다."}},
 {id:"4cgJsFnopZU",no:"5",ch:5,len:"3:23",title:"수업을 마치며",
  lead:"배운 내용을 정리하고, 다음에 공부할 방향을 안내합니다.",
  points:["지도학습 = 정답이 있는 데이터로 학습 → 모델 → 예측.","여러 알고리즘을 경쟁시키고, 나눠서 공정하게 평가하는 습관이 핵심입니다.","다음 단계: 정답 없이 패턴을 찾는 <b>비지도학습</b>, 내 데이터로 직접 실습하기."],
  widgets:["복습","내 데이터로 실습"],
  q:{t:"이 수업의 핵심 습관이 아닌 것은?",o:["여러 모델 비교하기","테스트 데이터를 따로 두기","가장 먼저 만든 모델을 그대로 쓰기"],a:2,e:"비교와 공정한 평가가 핵심입니다."}}
];
const KEY="orange3-sl-v1";
let st={done:{},quiz:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) st=Object.assign(st,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const sec=s=>s.split(":").reduce((a,b)=>a*60+ +b,0);
const total=L.reduce((a,l)=>a+sec(l.len),0);
document.getElementById("sTime").textContent=Math.floor(total/60)+"분";
let cur=0;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderNav(){
  let h="",last=0;
  L.forEach((l,i)=>{
    if(l.ch!==last){h+=`<div class="ch">${l.ch}장 · ${CHAPTERS[l.ch]}</div>`;last=l.ch;}
    h+=`<button class="item${st.done[l.id]?" done":""}" aria-current="${i===cur}" data-i="${i}">
      <span class="node">${st.done[l.id]?"✓":l.no}</span><span class="t">${esc(l.title)}</span><span class="d">${l.len}</span></button>`;
  });
  const nav=document.getElementById("curr"); nav.innerHTML=h;
  nav.querySelectorAll(".item").forEach(b=>b.onclick=()=>go(+b.dataset.i,true));
  const d=L.filter(l=>st.done[l.id]).length, q=L.filter(l=>st.quiz[l.id]).length;
  const p=Math.round(d/L.length*100);
  document.getElementById("sProg").textContent=p+"%";
  document.getElementById("pBar").style.width=p+"%";
  document.getElementById("sQuiz").textContent=q;
}

function renderLesson(){
  const l=L[cur], url=`https://www.youtube.com/watch?v=${l.id}&list=${PL}&index=${cur+1}`;
  const player = EMBED
    ? `<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${l.id}?rel=0" title="${esc(l.title)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`
    : `<a class="player" href="${url}" target="_blank" rel="noopener" aria-label="YouTube에서 ${esc(l.title)} 보기"><img src="${THUMBS[l.id]}" alt=""><span class="play"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>YouTube에서 재생 · ${l.len}</span></span></a>`;
  const ws=l.widgets.map(w=>`<span class="w">${esc(w)}</span>`).join('<span class="arrow">→</span>');
  const qa=st.quiz[l.id];
  const opts=l.q.o.map((o,i)=>`<button class="opt" data-k="${i}">${esc(o)}</button>`).join("");
  const done=!!st.done[l.id];
  document.getElementById("lesson").innerHTML=`${player}
  <div class="body">
    <div class="meta"><span class="tag">${l.ch}장 · ${CHAPTERS[l.ch]}</span><span>${l.no}강</span><span>${l.len}</span>${EMBED?`<a href="${url}" target="_blank" rel="noopener">YouTube에서 열기 ↗</a>`:""}</div>
    <h2>${esc(l.title)}</h2>
    <p class="lead">${l.lead}</p>
    <section><h3>핵심 정리</h3><ul class="points">${l.points.map(p=>`<li>${p}</li>`).join("")}</ul></section>
    <section><h3>등장하는 위젯 · 흐름</h3><div class="widgets">${ws}</div></section>
    <section class="quiz"><h3 style="margin:0">확인 퀴즈</h3><p>${esc(l.q.t)}</p><div class="opts">${opts}</div><p class="fb" id="fb"></p></section>
    <div class="ctrl">
      <button class="btn ${done?"done":"primary"}" id="bDone">${done?"✓ 수강 완료":"수강 완료로 표시"}</button>
      <div class="nav2"><button class="btn" id="bPrev" ${cur===0?"disabled":""}>← 이전</button><button class="btn" id="bNext" ${cur===L.length-1?"disabled":""}>다음 →</button></div>
    </div>
  </div>`;
  const box=document.getElementById("lesson"), fb=document.getElementById("fb");
  const show=(k)=>{box.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.k;b.disabled=true;if(i===l.q.a)b.classList.add("right");else if(i===k)b.classList.add("wrong");});
    if(k===l.q.a){fb.className="fb ok";fb.textContent="정답! "+l.q.e;}else{fb.className="fb no";fb.textContent="아쉬워요. "+l.q.e;}};
  if(qa) show(l.q.a);
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;show(k);if(k===l.q.a){st.quiz[l.id]=1;save();renderNav();}else{setTimeout(()=>{box.querySelectorAll(".opt").forEach(x=>{x.disabled=false;x.classList.remove("right","wrong")});},1600);}});
  document.getElementById("bDone").onclick=()=>{st.done[l.id]=!st.done[l.id];save();renderNav();renderLesson();};
  document.getElementById("bPrev").onclick=()=>go(cur-1,true);
  document.getElementById("bNext").onclick=()=>{ if(!st.done[l.id]){st.done[l.id]=true;save();} go(cur+1,true);};
}
function go(i,push){cur=Math.max(0,Math.min(L.length-1,i));if(push){try{history.replaceState(null,"","#lesson-"+(cur+1))}catch(e){location.hash="lesson-"+(cur+1)}}
  renderNav();renderLesson();if(push&&window.innerWidth<860)document.getElementById("lesson").scrollIntoView({behavior:"smooth"});}
function fromHash(){const m=/^#lesson-(\d+)$/.exec(location.hash);go(m?+m[1]-1:0,false);}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
